name: "Publish jaato-eval to PyPI"

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # jaato-eval imports jaato_sdk and nothing else from the tree (the
      # offline half — manifest, fixture, graders, results, report — needs the
      # library, not a running daemon), so jaato-server is deliberately not
      # installed here.
      - name: Install dependencies
        run: pip install -e jaato-sdk/ && pip install -e "jaato-eval/.[dev]"

      - name: Run tests
        run: pytest jaato-eval/tests/

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi-eval
    steps:
      # fetch-depth: 0 — scripts/build_readme.py derives the changelog that
      # becomes the package's PyPI long description from `git log` since the
      # previous "Bump <pkg>" commit.  checkout's default depth of 1 leaves it
      # a single commit to look at, so the published changelog was whatever
      # that one commit happened to be.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      # jaato-eval has never been released, so on the first run this check
      # simply sees a 404 for the project and passes.  From the second release
      # on it behaves exactly like its three siblings.
      - name: Check version not already on PyPI
        run: |
          version=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "Package version: $version"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/jaato-eval/${version}/json")
          if [ "$status" = "200" ]; then
            echo "::error::Version ${version} of jaato-eval already exists on PyPI"
            exit 1
          fi
          echo "Version ${version} is available for publishing"
        working-directory: jaato-eval

      # Not optional: pyproject's `readme` points at PKG_README.md, which is
      # gitignored and produced here.  Skipping this step publishes an empty
      # long description with only a warning.
      - name: Generate combined README
        run: python ../scripts/build_readme.py
        working-directory: jaato-eval

      - name: Build package
        run: python -m build .
        working-directory: jaato-eval

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: jaato-eval/dist/
