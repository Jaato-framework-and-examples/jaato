name: "Publish jaato-sdk to PyPI"

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi-sdk
    steps:
      # fetch-depth: 0 — scripts/build_readme.py derives the changelog that
      # becomes the package's PyPI long description from `git log` since the
      # previous "Bump <pkg>" commit.  checkout's default depth of 1 leaves it
      # a single commit to look at, so the published changelog was whatever
      # that one commit happened to be.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Check version not already on PyPI
        run: |
          version=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "Package version: $version"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/jaato-sdk/${version}/json")
          if [ "$status" = "200" ]; then
            echo "::error::Version ${version} of jaato-sdk already exists on PyPI"
            exit 1
          fi
          echo "Version ${version} is available for publishing"
        working-directory: jaato-sdk

      - name: Generate combined README
        run: python ../scripts/build_readme.py
        working-directory: jaato-sdk

      - name: Build package
        run: python -m build .
        working-directory: jaato-sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: jaato-sdk/dist/
