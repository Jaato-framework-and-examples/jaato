name: "Publish @jaato/sdk to npm"

# Mirror of publish-pypi-{sdk,server,tui,eval}.yml — manual trigger,
# tests gate, version-already-on-registry check, then a STAGED publish.
#
# Setup once on the npm side:
#   - The @jaato org owns @jaato/sdk on npmjs.com.
#   - A granular access token, "Read and write (stage only)" on @jaato/*,
#     lives in the GitHub repo's `npm-sdk` environment as NPM_TOKEN.
#     npm is retiring direct publish by token (January 2027), so the
#     token can only STAGE a version: the run uploads it non-public and a
#     maintainer with 2FA promotes it — `npm stage list @jaato/sdk`, then
#     `npm stage approve <stage-id> --otp <code>` — or on npmjs.com.
#     Until then the version is not on the registry, which is also what
#     the dependent packages' "is it on npm" gates measure.
#
# Migrating to npm Trusted Publishing (OIDC) later is a one-step
# change: replace the NODE_AUTH_TOKEN env wiring with `permissions:
# id-token: write` and `npm stage publish --provenance` after configuring
# the trusted publisher (stage-only) on npmjs.com.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install jaato-sdk (so events.py is importable for codegen check)
        run: pip install -e jaato-sdk/

      - name: Install jaato-sdk-ts dependencies
        working-directory: jaato-sdk-ts
        run: npm install --no-audit --no-fund

      - name: Verify events.ts is up to date with events.py
        # Same staleness gate the codegen-ts-events workflow runs on PRs,
        # repeated here so a manual publish from a stale branch fails fast.
        run: python scripts/codegen_ts_events.py --check

      - name: Build
        working-directory: jaato-sdk-ts
        run: npm run build

      - name: Test
        working-directory: jaato-sdk-ts
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that knows `npm stage` (11.15+)
        # setup-node's Node ships npm 10; staged publishing arrived in npm
        # 11.15.0.  Newest npm, not a pin: its `stage` surface is the one
        # the registry currently speaks.  The registry .npmrc setup-node
        # wrote is honoured with its placeholder token, as `npm install`
        # always was here.
        run: |
          npm install -g npm@latest --no-audit --no-fund
          npm --version
          npm stage publish --help >/dev/null

      - name: Read package version
        id: version
        working-directory: jaato-sdk-ts
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Package @jaato/sdk version: ${version}"

      - name: Check version not already on npm
        # 200 → version already published, 404 → ours to publish.
        # Anything else (rate-limited, registry transient) → fail loudly
        # so we don't accidentally re-publish or skip.
        run: |
          version="${{ steps.version.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/@jaato/sdk/${version}")
          if [ "$status" = "200" ]; then
            echo "::error::Version ${version} of @jaato/sdk already exists on npm"
            exit 1
          fi
          if [ "$status" != "404" ]; then
            echo "::error::Unexpected status ${status} from registry — refusing to publish"
            exit 1
          fi
          echo "Version ${version} is available for publishing"

      - name: Verify NPM_TOKEN is accepted by the registry
        # npm answers an unauthorised PUT on a scoped package with a bare
        # 404 ("'@jaato/x@y' is not in this registry"), so an expired,
        # revoked or read-only NPM_TOKEN otherwise surfaces at the very
        # last step, after the build, looking like a missing package.
        # `npm whoami` proves the token authenticates; it does not prove
        # write access to @jaato, which only the publish itself can.
        run: |
          user=$(npm whoami 2>/dev/null) || {
            echo "::error::the registry rejected NPM_TOKEN (npm whoami failed): expired, revoked, or not an npm token. Rotate the secret in the npm-sdk environment."
            exit 1
          }
          echo "Token authenticates as npm user '${user}'"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        working-directory: jaato-sdk-ts
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: jaato-sdk-ts
        run: npm run build

      - name: Stage the publish on npm (a maintainer with 2FA promotes it)
        # NPM_TOKEN is a "Read and write (stage only)" granular token: npm
        # is retiring direct publish by token (January 2027), and a
        # stage-only token gets E_STAGE_REQUIRED from `npm publish`.  So
        # the version is STAGED — uploaded, not public — and goes live only
        # when a maintainer approves it with a 2FA code, from the CLI or
        # npmjs.com.  --access public: scoped packages default to
        # restricted; the flag makes @jaato/sdk installable without auth.
        working-directory: jaato-sdk-ts
        run: |
          npm stage publish --access public
          version="${{ steps.version.outputs.version }}"
          echo "::notice::@jaato/sdk@${version} is STAGED, not live. Promote it with 2FA: npm stage list @jaato/sdk  then  npm stage approve <stage-id> --otp <code>  (or reject it with npm stage reject <stage-id>)."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
