name: "Publish @jaato/web-coder-server to npm"

# Mirror of publish-npm-web-coder-ui.yml, with one extra gate this package
# needs: it depends on @jaato/sdk and @jaato/web-coder-ui, which the
# checkout links with `file:` for development. The publish job builds
# against those links, then rewrites the manifest to the siblings' caret
# ranges (scripts/prepare-publish.mjs) and REFUSES to publish unless both
# of those versions are already on npm — so the order is SDK, then UI,
# then this (docs/design/web-server-bff.md §9), enforced rather than
# remembered.  A STAGED sibling is not on npm yet: each one has to be
# approved by a maintainer before the next workflow's gate opens.
#
# Same npm-side setup as the others: the stage-only @jaato org token in
# the repo's `npm-sdk` environment as NPM_TOKEN; this run stages too, and
# a maintainer with 2FA promotes (see the sdk workflow's header).

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            jaato-sdk-ts/package-lock.json
            jaato-web-coder-ui/package-lock.json
            jaato-web-coder-server/package-lock.json
      - name: Install + build the TS SDK
        working-directory: jaato-sdk-ts
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install the UI package
        working-directory: jaato-web-coder-ui
        run: npm ci --no-audit --no-fund
      - name: Install jaato-web-coder-server
        working-directory: jaato-web-coder-server
        run: npm ci --no-audit --no-fund
      - name: Type-check + build
        working-directory: jaato-web-coder-server
        run: npx tsc -p tsconfig.json
      - name: Tests
        working-directory: jaato-web-coder-server
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that knows `npm stage` (11.15+)
        # setup-node's Node ships npm 10; staged publishing arrived in npm
        # 11.15.0.  Newest npm, not a pin: its `stage` surface is the one
        # the registry currently speaks.  The registry .npmrc setup-node
        # wrote is honoured with its placeholder token, as `npm install`
        # always was here.
        run: |
          npm install -g npm@latest --no-audit --no-fund
          npm --version
          npm stage publish --help >/dev/null

      - name: Read versions
        id: version
        run: |
          v() { node -p "require('./$1/package.json').version"; }
          echo "version=$(v jaato-web-coder-server)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(v jaato-sdk-ts)" >> "$GITHUB_OUTPUT"
          echo "ui=$(v jaato-web-coder-ui)" >> "$GITHUB_OUTPUT"
          echo "server $(v jaato-web-coder-server); depends on sdk $(v jaato-sdk-ts), ui $(v jaato-web-coder-ui)"

      - name: Check version not already on npm
        run: |
          version="${{ steps.version.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@jaato/web-coder-server/${version}")
          if [ "$status" = "200" ]; then echo "::error::@jaato/web-coder-server ${version} already exists on npm"; exit 1; fi
          if [ "$status" != "404" ]; then echo "::error::Unexpected status ${status} from registry — refusing to publish"; exit 1; fi
          echo "Version ${version} is available"

      - name: Check @jaato/web-coder-server exists on npm (a first version cannot be staged)
        # `npm stage publish` is refused for a name the registry has never
        # seen — measured on this package's first run: `404 Not Found -
        # POST /-/stage/package/<name>`.  So a brand-new package's FIRST
        # version has to be published directly by a maintainer with 2FA,
        # from a checkout at this commit; every later version stages.
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@jaato/web-coder-server")
          if [ "$status" = "404" ]; then
            echo "::error::@jaato/web-coder-server has never been published, and npm cannot STAGE a first version. Publish it directly ONCE as a maintainer with 2FA, from a checkout at this commit: cd jaato-web-coder-server && npm --prefix ../jaato-sdk-ts ci && npm --prefix ../jaato-sdk-ts run build && npm --prefix ../jaato-web-coder-ui ci && npm ci && npm run build && node scripts/prepare-publish.mjs && npm publish --access public --otp <code>. Later versions stage."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Unexpected status ${status} from registry for @jaato/web-coder-server — refusing to continue"
            exit 1
          fi
          echo "@jaato/web-coder-server exists on npm; staging a new version is possible"

      - name: Verify NPM_TOKEN is accepted by the registry
        # npm answers an unauthorised PUT on a scoped package with a bare
        # 404 ("'@jaato/x@y' is not in this registry"), so an expired,
        # revoked or read-only NPM_TOKEN otherwise surfaces at the very
        # last step, after the build, looking like a missing package.
        # `npm whoami` proves the token authenticates; it does not prove
        # write access to @jaato, which only the publish itself can.
        run: |
          user=$(npm whoami 2>/dev/null) || {
            echo "::error::the registry rejected NPM_TOKEN (npm whoami failed): expired, revoked, or not an npm token. Rotate the secret in the npm-sdk environment."
            exit 1
          }
          echo "Token authenticates as npm user '${user}'"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check both dependencies are on npm at the versions the checkout links
        # The published manifest will say ^<sdk> and ^<ui>. If either exact
        # version is not on the registry, an `npm install @jaato/web-coder-server`
        # would fail for everyone — so refuse here, and say which to publish first.
        run: |
          for pair in "sdk:${{ steps.version.outputs.sdk }}" "web-coder-ui:${{ steps.version.outputs.ui }}"; do
            name="${pair%%:*}"; version="${pair##*:}"
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@jaato/${name}/${version}")
            if [ "$status" != "200" ]; then
              case "$name" in sdk) wf=publish-npm-sdk-ts.yml ;; *) wf="publish-npm-${name}.yml" ;; esac
              echo "::error::@jaato/${name} ${version} is not on npm (HTTP ${status}); publish it first (${wf})"
              exit 1
            fi
            echo "@jaato/${name} ${version} is on npm"
          done

      - name: "Install + build (against the file: links)"
        run: |
          npm --prefix jaato-sdk-ts ci --no-audit --no-fund
          npm --prefix jaato-sdk-ts run build
          npm --prefix jaato-web-coder-ui ci --no-audit --no-fund
          npm --prefix jaato-web-coder-server ci --no-audit --no-fund
          npm --prefix jaato-web-coder-server run build

      - name: Prepare the publishable manifest
        working-directory: jaato-web-coder-server
        run: |
          node scripts/prepare-publish.mjs
          node -p "JSON.stringify(require('./package.json').dependencies, null, 2)"

      - name: Stage the publish on npm (a maintainer with 2FA promotes it)
        # NPM_TOKEN is a "Read and write (stage only)" granular token: npm
        # is retiring direct publish by token (January 2027), and a
        # stage-only token gets E_STAGE_REQUIRED from `npm publish`.  So
        # the version is STAGED — uploaded, not public — and goes live only
        # when a maintainer approves it with a 2FA code, from the CLI or
        # npmjs.com.  --access public: scoped packages default to
        # restricted; the flag makes @jaato/web-coder-server installable without auth.
        # prepare-publish.mjs dropped `private`, which `npm stage publish`
        # refuses exactly as `npm publish` does.
        working-directory: jaato-web-coder-server
        run: |
          npm stage publish --access public
          version="${{ steps.version.outputs.version }}"
          echo "::notice::@jaato/web-coder-server@${version} is STAGED, not live. Promote it with 2FA: npm stage list @jaato/web-coder-server  then  npm stage approve <stage-id> --otp <code>  (or reject it with npm stage reject <stage-id>)."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
