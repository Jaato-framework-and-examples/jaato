name: "Publish @jaato/web-coder-ui to npm"

# Mirror of publish-npm-sdk-ts.yml for the browser client — manual
# trigger, the same gates the `web-client` CI job runs, a
# version-already-on-registry check, then publish.
#
# What ships: `dist/` (the Vite bundle, with @jaato/sdk compiled in) and
# `bin/jaato-web-coder-ui.js`, the dependency-free launcher behind
# `npx @jaato/web-coder-ui`.  The package has NO runtime dependencies — see the
# note above `devDependencies` in jaato-web-coder-ui/package.json.
#
# Byproduct for people who host the bundle themselves: the same run
# uploads `jaato-web-coder-ui-dist-<version>.tar.gz` (the contents of `dist/`)
# as a workflow artifact AND, once npm publish succeeded, attaches it to a
# GitHub Release tagged `web-coder-ui-v<version>` — artifacts expire after
# 90 days, a release is a stable URL an operator can pin.
#
# Setup once on the npm side: the same @jaato org token that publishes
# @jaato/sdk (granular, read+write on @jaato/*) lives in the repo's
# `npm-sdk` environment as NPM_TOKEN, so this workflow reuses it.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            jaato-sdk-ts/package-lock.json
            jaato-web-coder-ui/package-lock.json

      - name: Install + build the TS SDK (declarations for the type-check)
        working-directory: jaato-sdk-ts
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install jaato-web-coder-ui
        working-directory: jaato-web-coder-ui
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: jaato-web-coder-ui
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests (protocol, store, launcher)
        working-directory: jaato-web-coder-ui
        run: npm test

      - name: Production build
        working-directory: jaato-web-coder-ui
        run: npx vite build

      - name: Drop the unused third-party apt sources
        # Same reason as ci-tests.yml: `--with-deps` runs apt-get update.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
                        /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright Chromium
        working-directory: jaato-web-coder-ui
        run: npx playwright install --with-deps chromium

      - name: End-to-end against the mock daemon
        working-directory: jaato-web-coder-ui
        run: npx playwright test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-sdk
    permissions:
      contents: write        # the release that carries the self-hosting tarball
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Read package version
        id: version
        working-directory: jaato-web-coder-ui
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Package @jaato/web-coder-ui version: ${version}"

      - name: Check version not already on npm
        # 200 → version already published, 404 → ours to publish.
        # Anything else (rate-limited, registry transient) → fail loudly
        # so we don't accidentally re-publish or skip.
        run: |
          version="${{ steps.version.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/@jaato/web-coder-ui/${version}")
          if [ "$status" = "200" ]; then
            echo "::error::Version ${version} of @jaato/web-coder-ui already exists on npm"
            exit 1
          fi
          if [ "$status" != "404" ]; then
            echo "::error::Unexpected status ${status} from registry — refusing to publish"
            exit 1
          fi
          echo "Version ${version} is available for publishing"

      - name: Install dependencies
        run: |
          npm --prefix jaato-sdk-ts ci --no-audit --no-fund
          npm --prefix jaato-web-coder-ui ci --no-audit --no-fund

      - name: Build
        # `npm run build` builds the SDK declarations, type-checks, then
        # runs `vite build` → jaato-web-coder-ui/dist/.
        working-directory: jaato-web-coder-ui
        run: npm run build

      - name: Pack the self-hosting tarball
        working-directory: jaato-web-coder-ui
        run: tar -czf "jaato-web-coder-ui-dist-${{ steps.version.outputs.version }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: jaato-web-coder-ui-dist-${{ steps.version.outputs.version }}
          path: jaato-web-coder-ui/jaato-web-coder-ui-dist-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error

      - name: Publish to npm
        # --access public: scoped packages default to restricted on npm;
        # we want @jaato/web-coder-ui to be installable without auth.
        working-directory: jaato-web-coder-ui
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the self-hosting tarball to a GitHub Release
        # After publish, so a failed publish never leaves a release that
        # names a version npm does not have.  The tag is prefixed because
        # this repository publishes several packages.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="web-coder-ui-v${version}"
          gh release create "$tag" \
            "jaato-web-coder-ui/jaato-web-coder-ui-dist-${version}.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "@jaato/web-coder-ui ${version}" \
            --notes "Self-hosting bundle for @jaato/web-coder-ui ${version} (the contents of dist/). Also on npm: npx @jaato/web-coder-ui@${version}. Serve it behind any static host and publish a config.json next to index.html to pre-fill the daemon URL — see jaato-web-coder-ui/README.md."
