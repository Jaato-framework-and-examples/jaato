name: "Publish jaato-server to PyPI"

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `openrouter` is here for its `openai>=1.0` dependency, not for the
      # provider: shared/tests/test_connection_error_rebuilds_client.py does a
      # module-level `import openai`, so under a bare `.[dev]` it fails at
      # COLLECTION and pytest exits 2 with 4069 other tests never run. ci-tests
      # never saw this — it installs `.[all]` and passes
      # --continue-on-collection-errors — so the gap only ever showed up here,
      # on the job that gates a release.
      - name: Install dependencies
        run: pip install -e jaato-sdk/ && pip install -e "jaato-server/.[dev,openrouter]"

      - name: Run tests
        run: pytest jaato-server/shared/tests/ jaato-server/server/test_client.py jaato-server/server/test_workspace_command.py

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi-server
    steps:
      # fetch-depth: 0 — scripts/build_readme.py derives the changelog that
      # becomes the package's PyPI long description from `git log` since the
      # previous "Bump <pkg>" commit.  checkout's default depth of 1 leaves it
      # a single commit to look at, so the published changelog was whatever
      # that one commit happened to be.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Check version not already on PyPI
        run: |
          version=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('jaato-server/pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "Package version: $version"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/jaato-server/${version}/json")
          if [ "$status" = "200" ]; then
            echo "::error::Version ${version} of jaato-server already exists on PyPI"
            exit 1
          fi
          echo "Version ${version} is available for publishing"

      - name: Generate combined README
        run: python scripts/build_readme.py --dir jaato-server

      - name: Build package
        run: python -m build jaato-server/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: jaato-server/dist/
