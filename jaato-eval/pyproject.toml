[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jaato-eval"
version = "0.1.0"
description = "Benchmark spine over jaato's session and profile primitives"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    # jaato-sdk is imported lazily by runner.py / graders/judge.py so the
    # pure parts (manifest, fixture, ledger, script + processor graders,
    # results, report) are usable and testable without a daemon.  Declared
    # as an extra rather than a hard dependency to keep that true for
    # anyone vendoring only the offline half.
]

[project.optional-dependencies]
run = ["jaato-sdk"]
dev = ["pytest"]

[project.scripts]
jaato-eval = "jaato_eval.cli:main"

[tool.setuptools.packages.find]
include = ["jaato_eval*"]
