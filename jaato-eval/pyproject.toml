[build-system]
# 77, not 61: `license = "BUSL-1.1"` below is a PEP 639 SPDX expression, and
# setuptools only accepts that spelling from 77 onwards (older releases reject
# the string outright, demanding a {file=} / {text=} table).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jaato-eval"
version = "0.1.0"
description = "Benchmark spine over jaato's session and profile primitives"
# PKG_README.md is generated at publish time by scripts/build_readme.py
# (README.md with an auto-generated changelog prepended) and is gitignored,
# exactly as in jaato-sdk / jaato-server / jaato-tui.  A build that skips that
# step gets a SetuptoolsWarning and an EMPTY long description rather than an
# error, so the publish workflow must run the script — it is not optional.
readme = "PKG_README.md"
# 3.10, not 3.9: jaato-sdk (a hard dependency below) declares >=3.10, so a
# 3.9 floor here advertises an install that can never resolve.
requires-python = ">=3.10"
license = "BUSL-1.1"
authors = [
    {name = "apanoia"}
]
keywords = ["jaato", "eval", "benchmark", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0",
    # Required since the completeness rule and the tool-call ledger both
    # moved INTO the SDK (jaato #640, #648) and this package deletes its
    # copies rather than syncing them.  Importing the SDK still does not
    # require a daemon, so the offline half — manifest, fixture, script and
    # processor graders, results, report — remains testable without one;
    # what changed is that it needs the library, not a running server.
    "jaato-sdk",
]

[project.optional-dependencies]
dev = ["pytest"]
# `report --pdf` only.  The per-arm HTML document is written with no
# dependency at all and carries print CSS, so a browser is already a
# working PDF renderer; this extra buys the `--pdf` flag on a machine with
# no browser — a CI box, or a sweep host running unattended.  Kept optional
# so a default install stays dependency-free, and asked for loudly rather
# than falling back silently to HTML (see jaato_eval/report_html.py).
report = ["weasyprint>=60"]

[project.urls]
Repository = "https://github.com/Jaato-framework-and-examples/jaato"
Issues = "https://github.com/Jaato-framework-and-examples/jaato/issues"

[project.scripts]
jaato-eval = "jaato_eval.cli:main"

[tool.setuptools.packages.find]
include = ["jaato_eval*"]
