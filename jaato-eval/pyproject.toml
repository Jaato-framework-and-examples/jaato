[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jaato-eval"
version = "0.1.0"
description = "Benchmark spine over jaato's session and profile primitives"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    # Required since the completeness rule and the tool-call ledger both
    # moved INTO the SDK (jaato #640, #648) and this package deletes its
    # copies rather than syncing them.  Importing the SDK still does not
    # require a daemon, so the offline half — manifest, fixture, script and
    # processor graders, results, report — remains testable without one;
    # what changed is that it needs the library, not a running server.
    "jaato-sdk",
]

[project.optional-dependencies]
dev = ["pytest"]
# `report --pdf` only.  The per-arm HTML document is written with no
# dependency at all and carries print CSS, so a browser is already a
# working PDF renderer; this extra buys the `--pdf` flag on a machine with
# no browser — a CI box, or a sweep host running unattended.  Kept optional
# so a default install stays dependency-free, and asked for loudly rather
# than falling back silently to HTML (see jaato_eval/report_html.py).
report = ["weasyprint>=60"]

[project.scripts]
jaato-eval = "jaato_eval.cli:main"

[tool.setuptools.packages.find]
include = ["jaato_eval*"]
