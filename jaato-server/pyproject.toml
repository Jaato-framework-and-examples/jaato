[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaato-server"
version = "0.3.63"
description = "Jaato Server - LLM tool orchestration runtime and daemon"
readme = "PKG_README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
authors = [
    {name = "apanoia"}
]
keywords = ["llm", "ai", "tools", "orchestration", "vertex-ai", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jaato-sdk",  # SDK protocol: base plugin classes, type system (Message, ToolSchema, ProviderResponse), event definitions
    "requests",  # HTTP fallback client: OAuth token flows (Anthropic/Antigravity/GitHub), permission/reference/todo channels, Kerberos proxy support
    "google-genai",  # Google GenAI/Vertex AI model provider plugin (Gemini models)
    "mcp[cli]",  # MCP plugin: stdio-based MCP client for connecting to external MCP tool servers
    "google-api-core",  # GCP error handling: retry_utils.py rate-limit detection, token_accounting.py, Google GenAI provider exceptions
    "google-auth",  # GCP authentication: Application Default Credentials (ADC), service account keys, credential impersonation for Vertex AI
    "certifi",  # Mozilla CA certificate bundle: pinned explicitly for corporate environments where users append internal root CAs (ssl_helper.py guidance); also a transitive dep of httpx and requests
    "python-dotenv",  # Environment loading: server/core.py and workspace_manager.py load .env files during initialization
    "pyreadline3",  # Windows readline support: permission and reference channel plugins use `import readline` for interactive input (pyreadline3 provides this on Windows)
    "ddgs>=7.0.0",  # web_search plugin: DuckDuckGo search results via DDGS API
    "pyyaml",  # service_connector plugin: YAML OpenAPI specification parsing (openapi_parser.py, schema_store.py)
    "azure-ai-inference>=1.0.0b7",  # GitHub Models provider plugin: Azure AI Inference SDK for GitHub Copilot model access
    "websockets>=12.0",  # server/websocket.py: WebSocket server for remote client connections (TUI, web, external integrations)
    "anthropic>=0.40.0",  # Anthropic Claude model provider plugin: API key + OAuth auth, prompt caching, extended thinking
    "pybars3>=0.9.7",  # template plugin: Handlebars/Mustache template rendering engine (template_render tool)
    "httpx>=0.27.0",  # Primary async HTTP client: all model providers, web_fetch, OAuth flows, service_connector, proxy/Kerberos support
    "trafilatura>=1.6.0",  # web_fetch plugin: HTML article extraction with boilerplate removal (best for news/blog content)
    "html2text>=2024.2.26",  # web_fetch plugin: HTML-to-markdown conversion fallback when trafilatura is insufficient
    "beautifulsoup4>=4.12.0",  # web_fetch plugin: CSS selector support, structured HTML data extraction (links, tables, meta tags)
    "lxml>=5.0.0",  # Fast C-based HTML/XML parsing backend for beautifulsoup4 and trafilatura
    "ipython-pygments-lexers>=1.0.0",  # notebook plugin: IPython-aware syntax highlighting for cells with magic commands (%time, !shell)
    "Pillow>=10.0.0",  # mermaid_formatter plugin: PNG image resizing and color quantization for terminal diagram rendering (sixel, kitty, iterm2 backends)
    "pexpect>=4.8.0; sys_platform != 'win32'",  # interactive_shell plugin (Unix/macOS): PTY-based interactive sessions with idle-based output detection
    "wexpect>=4.0.0; sys_platform == 'win32'",  # interactive_shell plugin (Windows): Windows console API wrapper for interactive sessions
    "pywin32>=220; sys_platform == 'win32'",  # wexpect undeclared dependency: Windows console APIs
    "psutil>=5.0.0",  # Cross-platform: server health metrics (CPU/memory monitoring) + wexpect dependency on Windows
    "setuptools; sys_platform == 'win32'",  # wexpect dependency: requires pkg_resources at runtime
    "watchdog>=4.0.0",  # server/workspace_monitor.py: real-time filesystem monitoring with debounce buffering for workspace file change tracking
    "rich>=13.0.0",  # Shared plugins: terminal formatting (tables, panels, syntax highlighting) across multiple plugins
    "ast-grep-py>=0.30.0",  # ast_search plugin: multi-language AST-based code pattern search (Python, JS, TS, Go, Rust, Java, C/C++, etc.)
    "pymupdf4llm>=0.2.0",  # web_fetch plugin: PDF-to-markdown conversion for fetched PDF documents
    "sentence-transformers>=2.2.0",  # references plugin: local semantic embedding provider for reference matching (no API calls needed)
    "numpy>=1.24.0",  # references plugin: vector operations for embedding similarity + notebook plugin image processing
    "openai>=1.0",  # NIM and ZhipuAI model provider plugins: OpenAI-compatible SDK for NVIDIA NIM and Zhipu AI APIs
]

[project.urls]
Repository = "https://github.com/Jaato-framework-and-examples/jaato"
Issues = "https://github.com/Jaato-framework-and-examples/jaato/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
kaggle = [
    "kaggle>=1.5.0",
]
kerberos = [
    "pyspnego[kerberos]>=0.10.0",  # Kerberos/SPNEGO proxy authentication (includes gssapi on Linux/macOS)
]
telemetry = [
    "opentelemetry-api>=1.20.0",  # OTel API: tracer/meter interfaces for distributed tracing
    "opentelemetry-sdk>=1.20.0",  # OTel SDK: TracerProvider, span processors, samplers
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",  # OTLP gRPC exporter: primary export path for collectors (Phoenix, Jaeger, OTel Collector)
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",  # OTLP HTTP exporter: fallback when gRPC is unavailable
]
all = [
    "jaato-server[dev,kaggle,kerberos,telemetry]",
]

[project.scripts]
jaato-server = "server.__main__:main"

# Entry points for plugin discovery
# External packages can register plugins by adding to this group
[project.entry-points."jaato.plugins"]
artifact_tracker = "shared.plugins.artifact_tracker:create_plugin"
background = "shared.plugins.background:create_plugin"
calculator = "shared.plugins.calculator:create_plugin"
cli = "shared.plugins.cli:create_plugin"
environment = "shared.plugins.environment:create_plugin"
mcp = "shared.plugins.mcp:create_plugin"
lsp = "shared.plugins.lsp:create_plugin"
memory = "shared.plugins.memory:create_plugin"
multimodal = "shared.plugins.multimodal:create_plugin"
permission = "shared.plugins.permission:create_plugin"
references = "shared.plugins.references:create_plugin"
template = "shared.plugins.template:create_plugin"
todo = "shared.plugins.todo:create_plugin"
anthropic_auth = "shared.plugins.anthropic_auth:create_plugin"
ast_search = "shared.plugins.ast_search:create_plugin"

# Entry points for GC strategy plugins
# GC plugins implement context window garbage collection strategies
[project.entry-points."jaato.gc_plugins"]
gc_truncate = "shared.plugins.gc_truncate:create_plugin"
gc_summarize = "shared.plugins.gc_summarize:create_plugin"
gc_hybrid = "shared.plugins.gc_hybrid:create_plugin"
gc_budget = "shared.plugins.gc_budget:create_plugin"

# Entry points for Cache Control plugins
# Cache plugins manage provider-specific prompt caching strategies
[project.entry-points."jaato.cache_plugins"]
cache_anthropic = "shared.plugins.cache_anthropic:create_plugin"
cache_zhipuai = "shared.plugins.cache_zhipuai:create_plugin"
cache_google_genai = "shared.plugins.cache_google_genai:create_plugin"

# Entry points for premium extensions
# The jaato-premium package registers prompt providers, content paths,
# and gossip infrastructure via these groups.
[project.entry-points."jaato.premium"]
# Reserved for jaato-premium: prompt_provider, instructions, profiles, etc.

# Entry points for daemon extensions (e.g., gossip clustering from jaato-premium).
# Extensions are loaded at daemon startup; see server/__main__.py _load_extensions().
[project.entry-points."jaato.extensions"]
# Reserved — external packages register extensions in this group.

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "server*", "jaato*"]
