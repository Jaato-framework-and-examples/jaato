[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaato-server"
version = "0.7.0"
description = "Jaato Server - LLM tool orchestration runtime and daemon"
readme = "PKG_README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
authors = [
    {name = "apanoia"}
]
keywords = ["llm", "ai", "tools", "orchestration", "vertex-ai", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # --- Core (always installed) ---
    "jaato-sdk",  # SDK protocol: base plugin classes, type system (Message, ToolSchema, ProviderResponse), event definitions
    "requests",  # HTTP fallback client: OAuth token flows, permission/reference/todo channels, Kerberos proxy support
    "mcp[cli]",  # MCP plugin: stdio-based MCP client for connecting to external MCP tool servers
    "google-api-core",  # Core error handling: retry_utils.py rate-limit detection, token_accounting.py
    "certifi",  # Mozilla CA certificate bundle: pinned for corporate environments; transitive dep of httpx and requests
    "python-dotenv",  # Environment loading: server/core.py and workspace_manager.py load .env files during initialization
    "pyreadline3; sys_platform == 'win32'",  # Windows readline shim: permission and reference channel plugins
    "pyyaml",  # Core: session_manager, prompt_library, subagent config, memory plugin, service_connector
    "websockets>=12.0",  # server/websocket.py: WebSocket server for remote client connections
    "anthropic>=0.40.0",  # Core provider SDK: used by anthropic, ollama, and zhipuai providers
    "httpx>=0.27.0",  # Primary async HTTP client: all model providers, web_fetch, OAuth flows, proxy/Kerberos support
    "psutil>=5.0.0",  # Cross-platform: server health metrics (CPU/memory monitoring)
    "watchdog>=4.0.0",  # server/workspace_monitor.py: real-time filesystem monitoring with debounce buffering
    "rich>=13.0.0",  # Shared plugins: terminal formatting (tables, panels, syntax highlighting)
    "wcwidth",  # table_formatter plugin: East-Asian/emoji display-width for column alignment (unconditional import at plugin load)
    "jsonschema>=4.0.0",  # signal_completion typed payload validation against profile-declared completion_payload_schema
]

[project.urls]
Repository = "https://github.com/Jaato-framework-and-examples/jaato"
Issues = "https://github.com/Jaato-framework-and-examples/jaato/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "radon",  # test_cyclomatic_complexity_audit.py: the CI complexity ratchet. Pure-Python (no build deps), so it is safe for the light `contract-guards` job.
]
# --- Model provider extras ---
google = [
    "google-genai",  # Google GenAI/Vertex AI model provider plugin (Gemini models)
    "google-auth",  # GCP authentication: ADC, service account keys, credential impersonation
]
github-models = [
    "azure-ai-inference>=1.0.0b7",  # GitHub Models provider: Azure AI Inference SDK
]
nim = [
    "openai>=1.0",  # NIM and ZhipuAI model providers: OpenAI-compatible SDK
]
openrouter = [
    "openai>=1.0",  # OpenRouter model provider: OpenAI-compatible SDK
]
ovhcloud = [
    "openai>=1.0",  # OVHcloud AI Endpoints model provider: OpenAI-compatible SDK
]
# --- Plugin extras ---
web = [
    "trafilatura>=1.6.0",  # web_fetch plugin: HTML article extraction with boilerplate removal
    "html2text>=2024.2.26",  # web_fetch plugin: HTML-to-markdown conversion
    "beautifulsoup4>=4.12.0",  # web_fetch plugin: CSS selector support, structured HTML extraction
    "lxml>=5.0.0",  # Fast C-based HTML/XML parsing backend for beautifulsoup4 and trafilatura
    "pymupdf4llm>=0.2.0",  # web_fetch plugin: PDF-to-markdown conversion
    "ddgs>=7.0.0",  # web_search plugin: DuckDuckGo search results
]
interactive = [
    "pexpect>=4.8.0; sys_platform != 'win32'",  # interactive_shell plugin (Unix/macOS): PTY-based sessions
    "wexpect>=4.0.0; sys_platform == 'win32'",  # interactive_shell plugin (Windows): console API wrapper
    "pywin32>=220; sys_platform == 'win32'",  # wexpect undeclared dependency: Windows console APIs
    "setuptools; sys_platform == 'win32'",  # wexpect dependency: requires pkg_resources at runtime
]
ast = [
    "ast-grep-py>=0.30.0",  # ast_search plugin: multi-language AST-based code pattern search
]
notebook = [
    "ipython-pygments-lexers>=1.0.0",  # notebook plugin: IPython-aware syntax highlighting
]
diagrams = [
    "Pillow>=10.0.0",  # mermaid_formatter plugin: PNG image resizing for terminal rendering
]
templates = [
    "pybars3>=0.9.7",  # template plugin: Handlebars/Mustache template rendering engine
    "Jinja2>=3.1.0",  # template plugin: the OTHER first-class engine (SandboxedEnvironment render + AST variable extraction)
]
# --- Other extras ---
kaggle = [
    "kaggle>=1.5.0",
]
kerberos = [
    "pyspnego[kerberos]>=0.10.0",  # Kerberos/SPNEGO proxy authentication (includes gssapi on Linux/macOS)
]
telemetry = [
    "opentelemetry-api>=1.20.0",  # OTel API: tracer/meter interfaces for distributed tracing
    "opentelemetry-sdk>=1.20.0",  # OTel SDK: TracerProvider, span processors, samplers
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",  # OTLP gRPC exporter
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",  # OTLP HTTP exporter
]
all = [
    "jaato-server[dev,google,github-models,nim,openrouter,ovhcloud,web,interactive,ast,notebook,diagrams,templates,kaggle,kerberos,telemetry]",
]

[project.scripts]
jaato-server = "server.__main__:main"
jaato-scaffold = "shared.scaffold.__main__:main"

# Entry points for plugin discovery
# External packages can register plugins by adding to this group
[project.entry-points."jaato.plugins"]
artifact_tracker = "shared.plugins.artifact_tracker:create_plugin"
background = "shared.plugins.background:create_plugin"
bundle = "shared.plugins.bundle:create_plugin"
calculator = "shared.plugins.calculator:create_plugin"
cli = "shared.plugins.cli:create_plugin"
environment = "shared.plugins.environment:create_plugin"
mcp = "shared.plugins.mcp:create_plugin"
lsp = "shared.plugins.lsp:create_plugin"
memory = "shared.plugins.memory:create_plugin"
multimodal = "shared.plugins.multimodal:create_plugin"
permission = "shared.plugins.permission:create_plugin"
references = "shared.plugins.references:create_plugin"
template = "shared.plugins.template:create_plugin"
todo = "shared.plugins.todo:create_plugin"
anthropic_auth = "shared.plugins.anthropic_auth:create_plugin"
ast_search = "shared.plugins.ast_search:create_plugin"

# Entry points for GC strategy plugins
# GC plugins implement context window garbage collection strategies
[project.entry-points."jaato.gc_plugins"]
gc_truncate = "shared.plugins.gc_truncate:create_plugin"
gc_summarize = "shared.plugins.gc_summarize:create_plugin"
gc_hybrid = "shared.plugins.gc_hybrid:create_plugin"
gc_budget = "shared.plugins.gc_budget:create_plugin"

# Entry points for Cache Control plugins
# Cache plugins manage provider-specific prompt caching strategies
[project.entry-points."jaato.cache_plugins"]
cache_anthropic = "shared.plugins.cache_anthropic:create_plugin"
cache_zhipuai = "shared.plugins.cache_zhipuai:create_plugin"
cache_google_genai = "shared.plugins.cache_google_genai:create_plugin"

# Entry points for embedding subsystem (references plugin semantic matching).
# External packages register embedding_provider and semantic_matcher factories.
[project.entry-points."jaato.embedding"]
# Reserved — external packages (e.g. jaato-premium) register providers here.

# Entry points for premium extensions
# The jaato-premium package registers prompt providers, content paths,
# and gossip infrastructure via these groups.
[project.entry-points."jaato.premium"]
# Reserved for jaato-premium: prompt_provider, instructions, profiles, etc.

# Entry points for daemon extensions (e.g., gossip clustering from jaato-premium).
# Extensions are loaded at daemon startup; see server/__main__.py _load_extensions().
[project.entry-points."jaato.extensions"]
# Reserved — external packages register extensions in this group.

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "server*", "jaato_embedded*"]

[tool.pytest.ini_options]
# Register custom marks so pytest doesn't warn on use.  ``apparmor``
# gates the §2.6 multitenant integration test on hosts with
# CAP_MAC_ADMIN + CAP_SYSLOG; see
# docs/design/per_session_confined_runner_phase2_plan.md §6.8.
markers = [
    "apparmor: requires AppArmor (CAP_MAC_ADMIN) — runs on user-hosted server",
]
asyncio_mode = "auto"
