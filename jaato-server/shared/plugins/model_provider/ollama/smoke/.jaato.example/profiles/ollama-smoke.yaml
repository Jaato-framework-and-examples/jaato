name: ollama-smoke
description: >
  Pure chat smoke test for the ollama provider against a local Ollama
  server (v0.14.0+) speaking the Anthropic-compatible API. No tools,
  no GC — just round-trips /v1/messages to validate the provider wire.

model: qwen3:8b
provider: ollama

max_turns: 1

suppress_base_instructions: true

plugins: []

plugin_configs:
  ollama:
    host: "${OLLAMA_HOST}"
    context_length: 32768
