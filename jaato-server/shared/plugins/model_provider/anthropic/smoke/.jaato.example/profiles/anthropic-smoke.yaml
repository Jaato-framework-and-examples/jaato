name: anthropic-smoke
description: >
  Pure chat smoke test for the anthropic provider against
  api.anthropic.com. No tools, no GC — just round-trips Messages API
  to validate the provider wire.

model: claude-sonnet-4-6
provider: anthropic

max_turns: 1

suppress_base_instructions: true

plugins: []

plugin_configs:
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
