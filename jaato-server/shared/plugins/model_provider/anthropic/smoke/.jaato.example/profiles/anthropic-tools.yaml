name: anthropic-tools
description: >
  Tool-calling smoke for the anthropic provider — cli plugin (one tool
  call) + signal_completion (typed payload).  Exercises both the
  Anthropic tool-use wire shape and the schema-driven termination
  contract end-to-end.  Permission policy is default-allow so the
  harness needs no interactive permission handling.

model: claude-sonnet-4-6
provider: anthropic

max_turns: 4

suppress_base_instructions: true

plugins:
  - cli

plugin_configs:
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
  permission:
    policy:
      defaultPolicy: allow

# Declares a schema so signal_completion is exposed (2026-06-07
# gate).  Same 3-field shape as anthropic-signal_completion.yaml so
# the persona only has to learn one payload contract.
completion_payload_schema:
  type: object
  additionalProperties: false
  required:
    - summary
    - status
  properties:
    summary:
      type: string
      description: >
        One-sentence recap of what the tool call returned and the
        agent's interpretation.
    status:
      type: string
      enum: [ok, partial, failed]
      description: >
        Outcome classification.
    word_count:
      type: integer
      minimum: 0
      description: >
        Number of words in the summary.
