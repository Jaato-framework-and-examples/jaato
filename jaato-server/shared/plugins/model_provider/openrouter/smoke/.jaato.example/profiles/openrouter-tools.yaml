name: openrouter-tools
description: >
  Tool-calling smoke for the openrouter provider — cli plugin (one tool
  call) + signal_completion (typed payload).  Exercises both the
  OpenAI tools wire shape and the schema-driven termination
  contract end-to-end.  OpenRouter passes tool-call config to the
  selected upstream model.

model: anthropic/claude-sonnet-4.5
provider: openrouter

max_turns: 4

suppress_base_instructions: true

plugins:
  - cli

plugin_configs:
  openrouter:
    api_key: "${JAATO_OPENROUTER_API_KEY}"
    api_params:
      max_tokens: 256
  permission:
    policy:
      defaultPolicy: allow

# Declares a schema so signal_completion is exposed (2026-06-07
# gate).  Same 3-field shape as openrouter-signal_completion.yaml
# so the persona only has to learn one payload contract.
completion_payload_schema:
  type: object
  additionalProperties: false
  required:
    - summary
    - status
  properties:
    summary:
      type: string
      description: >
        One-sentence recap of what the tool call returned and the
        agent's interpretation.
    status:
      type: string
      enum: [ok, partial, failed]
      description: >
        Outcome classification.
    word_count:
      type: integer
      minimum: 0
      description: >
        Number of words in the summary.
