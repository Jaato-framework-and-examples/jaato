name: openrouter-tools
description: >
  Tool-calling smoke test for the openrouter provider. Exercises the OpenAI
  tools shape via the cli plugin — one tool call followed by a one-sentence
  summary. Permission policy is default-allow so the harness needs no
  interactive permission handling.

model: anthropic/claude-sonnet-4.5
provider: openrouter

max_turns: 4

suppress_base_instructions: true

plugins:
  - cli

plugin_configs:
  openrouter:
    api_key: "${JAATO_OPENROUTER_API_KEY}"
    api_params:
      max_tokens: 256
  permission:
    policy:
      defaultPolicy: allow
