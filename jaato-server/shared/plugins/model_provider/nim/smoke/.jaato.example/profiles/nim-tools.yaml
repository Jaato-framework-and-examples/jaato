name: nim-tools
description: >
  Tool-calling smoke test for the nim provider. Exercises the OpenAI
  tools shape via the cli plugin — one tool call followed by a
  one-sentence summary. Permission policy is default-allow so the
  harness needs no interactive permission handling.

model: meta/llama-3.1-8b-instruct
provider: nim

max_turns: 4

suppress_base_instructions: true

plugins:
  - cli

plugin_configs:
  nim:
    api_key: "${JAATO_NIM_API_KEY}"
    context_length: 8192
  permission:
    policy:
      defaultPolicy: allow
