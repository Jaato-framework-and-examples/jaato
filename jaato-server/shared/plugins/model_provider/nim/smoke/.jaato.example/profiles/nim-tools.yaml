name: nim-tools
description: >
  Tool-calling smoke for the nim provider — cli plugin (one tool
  call) + signal_completion (typed payload).  Exercises both the
  OpenAI tools wire shape and the schema-driven termination
  contract end-to-end.

model: meta/llama-3.1-8b-instruct
provider: nim

max_turns: 4

suppress_base_instructions: true

plugins:
  - cli

plugin_configs:
  nim:
    api_key: "${JAATO_NIM_API_KEY}"
    context_length: 8192
  permission:
    policy:
      defaultPolicy: allow

# Declares a schema so signal_completion is exposed (2026-06-07
# gate).  Same 3-field shape as nim-signal_completion.yaml so the
# persona only has to learn one payload contract.
completion_payload_schema:
  type: object
  additionalProperties: false
  required:
    - summary
    - status
  properties:
    summary:
      type: string
      description: >
        One-sentence recap of what the tool call returned and the
        agent's interpretation.
    status:
      type: string
      enum: [ok, partial, failed]
      description: >
        Outcome classification.
    word_count:
      type: integer
      minimum: 0
      description: >
        Number of words in the summary.
