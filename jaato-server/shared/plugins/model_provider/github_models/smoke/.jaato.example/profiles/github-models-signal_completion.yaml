name: github-models-signal_completion
description: >
  Lifecycle smoke for the github_models provider — exercises
  signal_completion with a non-trivial completion_payload_schema
  (3 fields, 2 required).  Validates the schema-driven termination
  contract end-to-end: schema declared → signal_completion is
  exposed (2026-06-07 gate) → model emits payload →
  jsonschema.validate passes → session ends.

model: openai/gpt-4o
provider: github_models

max_turns: 3

suppress_base_instructions: true

plugins: []

plugin_configs:
  github_models:
    api_key: "${GITHUB_TOKEN}"

completion_payload_schema:
  type: object
  additionalProperties: false
  required:
    - summary
    - status
  properties:
    summary:
      type: string
      description: >
        A one-sentence summary of what the agent did.  Required.
    status:
      type: string
      enum: [ok, partial, failed]
      description: >
        Outcome classification.  Required.  ``ok`` for normal
        completion, ``partial`` if some sub-task was skipped,
        ``failed`` if the agent gave up.
    word_count:
      type: integer
      minimum: 0
      description: >
        Number of words in the summary.  Optional but tests
        whether weak models can emit integer typed fields.
