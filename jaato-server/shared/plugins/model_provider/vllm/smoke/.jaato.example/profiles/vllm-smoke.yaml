name: vllm-smoke
description: >
  Pure chat smoke test for the vllm provider against a remote vLLM
  OpenAI-compatible server. No tools, no GC — just round-trips
  /v1/chat/completions to validate the provider wire.

model: Qwen/Qwen2.5-7B-Instruct
provider: vllm

max_turns: 1

suppress_base_instructions: true

plugins: []

plugin_configs:
  vllm:
    host: "${VLLM_HOST}"
    context_length: 8192
