name: vllm-tools
description: >
  Tool-calling smoke for the vllm provider — cli plugin (one tool
  call) + signal_completion (typed payload).  Exercises both the
  OpenAI tools wire shape and the schema-driven termination
  contract end-to-end.

  Requires the vLLM server to have been launched with
  --enable-auto-tool-choice --tool-call-parser <name> matching the
  model family (e.g. hermes for Qwen2.5, llama3_json for Llama 3.1).

model: Qwen/Qwen2.5-7B-Instruct
provider: vllm

max_turns: 4

suppress_base_instructions: true

plugins:
  - cli

plugin_configs:
  vllm:
    host: "${VLLM_HOST}"
    context_length: 8192
  permission:
    policy:
      defaultPolicy: allow

# Declares a schema so signal_completion is exposed (2026-06-07
# gate).  Same 3-field shape as vllm-signal_completion.yaml so the
# persona only has to learn one payload contract.
completion_payload_schema:
  type: object
  additionalProperties: false
  required:
    - summary
    - status
  properties:
    summary:
      type: string
      description: >
        One-sentence recap of what the tool call returned and the
        agent's interpretation.
    status:
      type: string
      enum: [ok, partial, failed]
      description: >
        Outcome classification.
    word_count:
      type: integer
      minimum: 0
      description: >
        Number of words in the summary.
