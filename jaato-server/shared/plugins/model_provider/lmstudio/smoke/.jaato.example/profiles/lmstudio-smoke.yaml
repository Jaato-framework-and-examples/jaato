name: lmstudio-smoke
description: >
  Pure chat smoke test for the lmstudio provider against a local LM
  Studio server. No tools, no GC — just round-trips
  /v1/chat/completions to validate the provider wire.

model: openai/gpt-oss-20b
provider: lmstudio

max_turns: 1

suppress_base_instructions: true

plugins: []

plugin_configs:
  lmstudio:
    host: "${LMSTUDIO_HOST}"
