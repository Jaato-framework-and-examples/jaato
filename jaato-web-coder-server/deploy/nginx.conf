# nginx equivalent of the Caddyfile. TLS certificates are yours to provide
# (certbot works unchanged). The `map` and the two `proxy_set_header`
# lines under /daemon are what make the WebSocket upgrade work.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name jaato.example.org;

    ssl_certificate     /etc/letsencrypt/live/jaato.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaato.example.org/privkey.pem;

    # the jaato daemon's WebSocket (loopback 8080), mounted at /daemon
    location = /daemon {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Keycloak (native install, 8180)
    location /auth/ {
        proxy_pass http://127.0.0.1:8180/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # jaato-web-coder-server: sign-in, tickets, and the bundle
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name jaato.example.org;
    return 301 https://$host$request_uri;
}
