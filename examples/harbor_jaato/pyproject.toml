[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-jaato"
version = "0.1.0"
description = "Harbor BaseAgent that runs a jaato-server inside the eval environment"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
authors = [{ name = "jaato contributors" }]

dependencies = [
    "harbor",
    "jaato-sdk>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Register with Harbor's agent discovery so `harbor run --agent jaato` works.
[project.entry-points."harbor.agents"]
jaato = "harbor_jaato:JaatoAgent"

# The parent repo's .gitignore has `src/` (with a negation for
# examples/*/src/ in tracked-files terms only). Hatchling's default
# file selector still inherits the broad `src/` exclude when walking
# .gitignore patterns, so the wheel ships empty unless we either
# (a) disable .gitignore awareness or (b) list files explicitly.
# We do both: ignore-vcs turns off the gitignore filter, and
# include= lists the package contents so the result is reproducible.
[tool.hatch.build]
ignore-vcs = true
include = [
    "src/harbor_jaato/**/*.py",
    "src/harbor_jaato/data/*.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_jaato"]

# Mirrored config for cross-tool builds (setuptools as a fallback).
[tool.setuptools.package-data]
harbor_jaato = ["data/*.md"]
