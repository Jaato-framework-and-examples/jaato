[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-jaato"
version = "0.1.0"
description = "Harbor BaseAgent that runs a jaato-server inside the eval environment"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
authors = [{ name = "jaato contributors" }]

dependencies = [
    "harbor",
    "jaato-sdk>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Register with Harbor's agent discovery so `harbor run --agent jaato` works.
[project.entry-points."harbor.agents"]
jaato = "harbor_jaato:JaatoAgent"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_jaato"]

# Hatch already includes data/*.md under packages = [...]; the
# setuptools.package-data block below is kept for cross-tool
# compatibility (per the harbor-jaato review checklist) so the
# package builds correctly under either backend.
[tool.setuptools.package-data]
harbor_jaato = ["data/*.md"]
