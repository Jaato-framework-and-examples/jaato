[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaato-sdk"
version = "0.29.0"
description = "Jaato SDK - Protocol and client library for jaato server"
readme = "PKG_README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
authors = [
    {name = "apanoia"}
]
keywords = ["jaato", "sdk", "ipc", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv",  # Environment loading: .env file support for SDK configuration (IPC socket paths, server settings)
    "pydantic>=2.0,<3",  # Event-protocol model definitions (events.py); chosen for JSON Schema export so the upcoming TS SDK can codegen typed event shapes from the same source of truth.
]

[project.urls]
Repository = "https://github.com/Jaato-framework-and-examples/jaato"
Issues = "https://github.com/Jaato-framework-and-examples/jaato/issues"

[project.scripts]
# Client-side preflight doctor — diagnoses an SDK client's env / socket /
# daemon / auth before it ever calls connect().
jaato-doctor = "jaato_sdk.doctor:main"
# The ONE declaration of jaato-scaffold (#1267).  The shell and the authoring
# verbs (`new`, `integration`) ship here, because application developers
# install only the SDK.  jaato-server contributes `explain` / `validate` /
# `dependencies` / `releases` through the `jaato.scaffold_verbs` entry-point
# group in its own pyproject; it must never declare this script too, or two
# distributions would fight over one file in bin/.
jaato-scaffold = "jaato_sdk.scaffold.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
# WebSocket transport (WSClient) — drive a remote daemon over ws:// / wss://.
# Optional so the IPC / in-process paths don't require it.
ws = [
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jaato_sdk*", "jaato*"]

# Integrations ship WITH the scaffold that applies them, so an applied copy
# cannot describe a different version than the one installed.
# `jaato-scaffold integration <name>` applies one; `jaato-doctor` compares the
# stamp it leaves against this distribution's version.
# `authoring_snapshot.json` is what `jaato-scaffold new` reads about providers
# and env vars when jaato-server's source tree is not installed beside it
# (#1267).
[tool.setuptools.package-data]
"jaato_sdk.scaffold" = ["integrations/*/integration.json", "integrations/*/payload/*.md",
                        "integrations/*/payload/*.sh", "integrations/*/payload/references/*.md",
                        "authoring_snapshot.json"]

[tool.pytest.ini_options]
markers = [
    "load: load/perf tests — opt-in via -m load (skipped by default)",
    "conformance: live tests against a real daemon — opt-in via -m conformance",
]
# Skip load tests in normal runs.  To run only the load tests:
#     pytest -m load jaato-sdk/jaato_sdk/tests/
addopts = "-m 'not load and not conformance'"
asyncio_mode = "auto"
